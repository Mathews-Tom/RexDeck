[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "rexdeck"
version = "0.6.0"
description = "Terminal tools and purpose-built CLI/API interfaces in native Rex panes"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Tom Mathews" }]
keywords = ["rex", "terminal", "yazi", "lazygit"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Operating System :: MacOS :: MacOS X",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
    "httpx>=0.28.1,<1",
    "pyyaml>=6.0.3,<7",
    "textual>=6,<7",
]

[project.urls]
Homepage = "https://github.com/Mathews-Tom/RexDeck"
Repository = "https://github.com/Mathews-Tom/RexDeck"
Issues = "https://github.com/Mathews-Tom/RexDeck/issues"
Changelog = "https://github.com/Mathews-Tom/RexDeck/blob/main/CHANGELOG.md"

[project.scripts]
rexdeck = "rexdeck.cli:main"

[dependency-groups]
dev = [
    "mypy>=1.15,<2",
    "pytest>=8,<10",
    "ruff>=0.11,<1",
    "types-pyyaml>=6.0.12.20261103,<7",
]

[tool.hatch.build.targets.wheel]
packages = ["src/rexdeck"]

[tool.hatch.build.targets.sdist]
only-include = [
  "src/rexdeck", "tests", "plugins", "docs", "README.md", "CHANGELOG.md",
  "LICENSE", "pyproject.toml", "uv.lock",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.mypy]
strict = true
files = ["src", "tests"]
mypy_path = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]
