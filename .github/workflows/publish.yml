name: publish approved 0.1.0
on:
  workflow_dispatch:
    inputs:
      commit:
        description: Approved full main commit SHA
        required: true
        type: string
      artifact_id:
        description: Approved checks artifact ID
        required: true
        type: string
      wheel_sha256:
        description: Approved wheel SHA-256
        required: true
        type: string
      sdist_sha256:
        description: Approved sdist SHA-256
        required: true
        type: string
      approval_url:
        description: Owner approval URL binding commit, artifact, hashes and evidence
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: pypi-0.1.0
  cancel-in-progress: false
jobs:
  candidate:
    if: github.repository == 'Mathews-Tom/RexDeck' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - name: Bind candidate provenance and owner review inputs
        uses: actions/github-script@v7
        env:
          INPUTS: ${{ toJSON(inputs) }}
        with:
          script: |
            const i = JSON.parse(process.env.INPUTS);
            if (!/^[a-f0-9]{40}$/.test(i.commit) || i.commit !== context.sha)
              throw new Error('Dispatch main must be the exact approved commit');
            if (!/^[1-9][0-9]*$/.test(i.artifact_id) ||
                !/^[a-f0-9]{64}$/.test(i.wheel_sha256) ||
                !/^[a-f0-9]{64}$/.test(i.sdist_sha256) ||
                !/^https:\/\/github\.com\/Mathews-Tom\/RexDeck\//.test(i.approval_url))
              throw new Error('Invalid artifact, hashes or repository approval URL');
            const repo = context.repo;
            const artifact = (await github.rest.actions.getArtifact({...repo, artifact_id: Number(i.artifact_id)})).data;
            if (artifact.expired || artifact.name !== 'rexdeck-0.1.0' || artifact.workflow_run.head_sha !== i.commit)
              throw new Error('Artifact does not match approved candidate');
            const run = (await github.rest.actions.getWorkflowRun({...repo, run_id: artifact.workflow_run.id})).data;
            if (run.head_repository.full_name !== context.payload.repository.full_name ||
                run.head_sha !== i.commit || run.head_branch !== 'main' ||
                run.event !== 'push' || run.conclusion !== 'success' ||
                run.path !== '.github/workflows/checks.yml')
              throw new Error('Artifact must come from successful main push checks');
            const env = (await github.rest.repos.getEnvironment({...repo, environment_name: 'pypi'})).data;
            const approvals = env.protection_rules.filter(r => r.type === 'required_reviewers');
            if (approvals.length !== 1 || approvals[0].reviewers.length !== 1 ||
                approvals[0].reviewers[0].type !== 'User' ||
                approvals[0].reviewers[0].reviewer.login !== 'Mathews-Tom')
              throw new Error('pypi environment requires the repository owner as its sole reviewer');
            let ref = (await github.rest.git.getRef({...repo, ref: 'tags/v0.1.0'})).data.object;
            if (ref.type !== 'tag') throw new Error('v0.1.0 must be annotated');
            ref = (await github.rest.git.getTag({...repo, tag_sha: ref.sha})).data.object;
            if (ref.type !== 'commit' || ref.sha !== i.commit) throw new Error('Tag target mismatch');
            await core.summary.addHeading('Owner approval required: exact publication candidate')
              .addCodeBlock(JSON.stringify(i, null, 2), 'json')
              .addLink('Source checks run', run.html_url)
              .addRaw('\nReview all inputs against the owner approval before approving the pypi environment.\n').write();
  publish:
    needs: candidate
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: ${{ inputs.approval_url }}
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - name: Download only the approved immutable artifact
        uses: actions/github-script@v7
        env:
          ARTIFACT_ID: ${{ inputs.artifact_id }}
        with:
          script: |
            const archive = await github.rest.actions.downloadArtifact({
              ...context.repo, artifact_id: Number(process.env.ARTIFACT_ID), archive_format: 'zip'
            });
            require('fs').writeFileSync('candidate.zip', Buffer.from(archive.data));
      - name: Verify exact filenames and approved hashes without rebuilding
        env:
          WHEEL_SHA256: ${{ inputs.wheel_sha256 }}
          SDIST_SHA256: ${{ inputs.sdist_sha256 }}
        run: |
          python3 - <<'PY'
          import hashlib
          import os
          import pathlib
          import zipfile

          expected = {
              'rexdeck-0.1.0-py3-none-any.whl': os.environ['WHEEL_SHA256'],
              'rexdeck-0.1.0.tar.gz': os.environ['SDIST_SHA256'],
          }
          with zipfile.ZipFile('candidate.zip') as archive:
              if sorted(archive.namelist()) != sorted(expected):
                  raise SystemExit('Artifact must contain exactly the approved pair')
              pathlib.Path('approved').mkdir()
              for name, digest in expected.items():
                  data = archive.read(name)
                  if hashlib.sha256(data).hexdigest() != digest:
                      raise SystemExit(f'Approved hash mismatch: {name}')
                  pathlib.Path('approved', name).write_bytes(data)
          PY
      - uses: astral-sh/setup-uv@v6
      - name: Publish exact approved pair using PyPI Trusted Publishing
        run: >-
          uv publish --trusted-publishing always
          approved/rexdeck-0.1.0.tar.gz
          approved/rexdeck-0.1.0-py3-none-any.whl
