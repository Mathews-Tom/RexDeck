name: checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  product:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy --strict
      - run: brew install luajit
      - run: uv run pytest
      - name: Lua syntax
        run: |
          for file in plugins/files/*.lua; do
            luajit -b "$file" "$RUNNER_TEMP/$(basename "$file").out"
          done
