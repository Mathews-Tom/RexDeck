name: checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  product:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy --strict
      - run: brew install luajit
      - run: uv run pytest
      - name: Shared native host Lua syntax
        run: luajit -b src/rexdeck/host/main.lua "$RUNNER_TEMP/rexdeck-shared.out"
      - name: Build installable release artifacts
        run: |
          uv build --no-sources --out-dir "$RUNNER_TEMP/rexdeck-dist"
          uv venv "$RUNNER_TEMP/rexdeck-wheel"
          uv pip install --python "$RUNNER_TEMP/rexdeck-wheel/bin/python" "$RUNNER_TEMP/rexdeck-dist/rexdeck-0.4.1-py3-none-any.whl"
      - name: Installed CLI, adapters, metadata and shared Lua
        working-directory: ${{ runner.temp }}
        run: |
          "$RUNNER_TEMP/rexdeck-wheel/bin/rexdeck" --help
          "$RUNNER_TEMP/rexdeck-wheel/bin/rexdeck" plugins
          git init "$RUNNER_TEMP/rexdeck-installed-repo"
          for check in "directory $RUNNER_TEMP" "git-worktree $RUNNER_TEMP/rexdeck-installed-repo"; do
            context="${check%% *}"; target="${check#* }"
            resolved="$(cd "$target" && pwd -P)"
            "$RUNNER_TEMP/rexdeck-wheel/bin/python" -m rexdeck.host.launch context "$context" "$target" \
              | "$RUNNER_TEMP/rexdeck-wheel/bin/python" -c 'import json, sys; assert json.load(sys.stdin)["cwd"] == sys.argv[1]' "$resolved"
          done
          "$RUNNER_TEMP/rexdeck-wheel/bin/python" - <<'PY'
          import os
          import subprocess
          from importlib.metadata import distribution
          from importlib.resources import files
          from pathlib import Path

          package = distribution("rexdeck")
          assert package.version == "0.4.1"
          assert package.metadata["License-Expression"] == "MIT"
          assert any(str(path).endswith("/licenses/LICENSE") for path in package.files)
          assert files("rexdeck").joinpath("host/launch.py").is_file()
          source = files("rexdeck").joinpath("host/main.lua")
          output = Path(os.environ["RUNNER_TEMP"]) / "rexdeck-installed-host.out"
          subprocess.run(["luajit", "-b", str(source), str(output)], check=True)
          PY
      - name: Retain exact candidate artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rexdeck-0.4.1
          path: |
            ${{ runner.temp }}/rexdeck-dist/rexdeck-0.4.1.tar.gz
            ${{ runner.temp }}/rexdeck-dist/rexdeck-0.4.1-py3-none-any.whl
          if-no-files-found: error
          retention-days: 14
